name: Youth RAG CI

on:
  pull_request:
  push:
    branches:
      - work/consolidate-youth-rag

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      OPENAI_API_KEY: test-only-placeholder
      LANGSMITH_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install -e ./backend

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Compile backend sources
        run: python -m compileall -q backend/app

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --pool=forks --poolOptions.forks.singleFork=true

      - name: Build frontend
        working-directory: frontend
        run: npm run build
