version: 1
description: Manual Graph RAG policy items curated from policy_blocks.json.
items:
  - id: card.payment_method.check_card_required
    label: 청년수당 지원금 체크카드 사용 원칙
    node_label: PolicyRule
    decision: required
    source_block_id: ocr-page-12-block-0
    evidence_text: "청년수당 지원금은 반드시 체크카드로 사용해야 합니다."
    properties:
      intent: card_usage
      rule_type: require_payment_method
      support_level: direct
    relationships:
      - type: ALLOWED_BY_METHOD
        target_label: PaymentMethod
        target_key: method_check_card
        target_name: 체크카드
        properties:
          condition: 청년수당 지원금은 전용 체크카드로 사용해야 함

  - id: card.online_card_payment.allowed
    label: 온라인 카드 결제 허용
    node_label: PolicyRule
    decision: allowed
    source_block_id: ocr-page-12-block-0
    evidence_text: "오프라인은 물론 온라인에서도 카드 결제로 사용할 수 있습니다."
    properties:
      intent: card_usage
      rule_type: allow
      support_level: direct
    relationships:
      - type: ALLOWED_BY_METHOD
        target_label: PaymentMethod
        target_key: method_online_card
        target_name: 온라인 카드 결제
        properties:
          condition: 사용 목적에 맞게 체크카드로 결제한 경우

  - id: card.simple_payment.blocked
    label: 간편결제 사용 불가
    node_label: PolicyRule
    decision: blocked
    source_block_id: ocr-page-12-block-0
    evidence_text: "단 카카오페이, 네이버페이 등 간편 결제 불가"
    properties:
      intent: card_usage
      rule_type: block
      support_level: direct
      examples:
        - 카카오페이
        - 네이버페이
    relationships:
      - type: PROHIBITED_BY_METHOD
        target_label: PaymentMethod
        target_key: method_simple_payment
        target_name: 간편결제
        properties:
          reason: 카카오페이, 네이버페이 등 간편 결제 불가

  - id: spending.housing.allowed
    label: 주거비 사용 가능
    node_label: PolicyRule
    decision: allowed
    source_block_id: ocr-page-12-block-0
    evidence_text: "사용 예 | 주거비 | 월세, 관리비, 공과금(세금 및 연금 제외), 주거 관련 대출 원금 및 이자 등"
    properties:
      intent: card_usage
      rule_type: allow
      support_level: direct
    relationships:
      - type: ALLOWS
        target_label: SpendingCategory
        target_key: category_housing
        target_name: 주거비
        properties:
          examples:
            - 월세
            - 관리비
            - 공과금
            - 주거 관련 대출 원금 및 이자

  - id: spending.living.allowed
    label: 생활비 사용 가능
    node_label: PolicyRule
    decision: allowed
    source_block_id: ocr-page-12-block-1
    evidence_text: "생활비 | 식비, 통신비(소액결제 제외), 교통비 (해외 항공권 제외), 건강보험료 등"
    properties:
      intent: card_usage
      rule_type: allow
      support_level: direct
    relationships:
      - type: ALLOWS
        target_label: SpendingCategory
        target_key: category_living
        target_name: 생활비
        properties:
          examples:
            - 식비
            - 통신비
            - 교통비
            - 건강보험료

  - id: spending.education_job.allowed
    label: 교육비와 구직활동비 사용 가능
    node_label: PolicyRule
    decision: allowed
    source_block_id: ocr-page-12-block-1
    evidence_text: "교육비·구직활동비 | 학원비, 도서 구매비, 시험 응시료, 면접 복장 구매 및 대여비, 학자금대출 원금 및 이자, 생성형 AI 구독료 등"
    properties:
      intent: card_usage
      rule_type: allow
      support_level: direct
    relationships:
      - type: ALLOWS
        target_label: SpendingCategory
        target_key: category_education_job
        target_name: 교육비·구직활동비
        properties:
          examples:
            - 학원비
            - 도서 구매비
            - 시험 응시료
            - 면접 복장 구매 및 대여비
            - 학자금대출 원금 및 이자
            - 생성형 AI 구독료

  - id: spending.clean_card.blocked_categories
    label: 클린카드 사용 불가 업종 제한
    node_label: PolicyRule
    decision: blocked
    source_block_id: ocr-page-12-block-1
    evidence_text: "사용 불가 항목 클린카드 사용 불가 업종에 대한 지출 ◆ 호텔, 주점, 복권 판매, 피부미용, 마사지 등 48개 업종"
    properties:
      intent: card_usage
      rule_type: block
      support_level: direct
      examples:
        - 호텔
        - 주점
        - 복권 판매
        - 피부미용
        - 마사지
        - 상품권판매
    relationships:
      - type: PROHIBITS
        target_label: Restriction
        target_key: restriction_clean_card_blocked_category
        target_name: 클린카드 사용 불가 업종
        properties:
          reason: 클린카드 제한 업종에서는 카드 결제 불가

  - id: spending.asset_accumulation.blocked
    label: 자산 운영·축적 및 투자 지출 불가
    node_label: PolicyRule
    decision: blocked
    source_block_id: ocr-page-12-block-2
    evidence_text: "예금, 적금, 세금 납부, 보험료 납부, 국민연금 납부, 상품권(기프티콘 포함) 구매, 결제 포인트 구매, 충전식 결제, 신용카드 대금 납부, 일반대출 상환"
    properties:
      intent: card_usage
      rule_type: block
      support_level: direct
    relationships:
      - type: PROHIBITS
        target_label: Restriction
        target_key: restriction_asset_accumulation
        target_name: 자산 운영·축적 및 투자 지출
        properties:
          examples:
            - 예금
            - 적금
            - 상품권 구매
            - 결제 포인트 구매
            - 충전식 결제
            - 신용카드 대금 납부
            - 일반대출 상환

  - id: spending.social_order.blocked
    label: 사회 정서상 허용되기 어려운 지출 불가
    node_label: PolicyRule
    decision: blocked
    source_block_id: ocr-page-12-block-2
    evidence_text: "기타 사회 정서에 반하는 지출 도박·게임 등 사행성 분야에 대한 지출, 유흥비, 진로 탐색 및 구직활동과 무관한 고가의 사치품 구매나 고액의 서비스 이용"
    properties:
      intent: card_usage
      rule_type: block
      support_level: direct
    relationships:
      - type: PROHIBITS
        target_label: Restriction
        target_key: restriction_social_order
        target_name: 사회 정서상 허용되기 어려운 지출
        properties:
          examples:
            - 도박
            - 게임 등 사행성 분야
            - 유흥비
            - 고가 사치품
            - 고액 서비스

  - id: cash_transfer.general.conditional
    label: 계좌이체는 특정 항목과 증빙 제출 시 인정
    node_label: PolicyRule
    decision: conditional
    source_block_id: ocr-page-13-block-0
    evidence_text: "현금 사용(계좌이체)은 주거비, 생활공과금, 교육비 등 3개 항목에서 증빙서류를 제출한 경우에만 인정됩니다."
    properties:
      intent: cash_transfer
      rule_type: conditional_allow
      support_level: direct
      condition: 주거비, 생활공과금, 교육비 등 특정 항목에서 증빙서류 제출 시 인정
    relationships:
      - type: ALLOWED_BY_METHOD
        target_label: PaymentMethod
        target_key: method_cash_transfer
        target_name: 계좌이체
        properties:
          condition: 특정 항목에 한하여 증빙 제출 시 인정
      - type: REQUIRES_EVIDENCE
        target_label: EvidenceDocument
        target_key: doc_cash_transfer_evidence
        target_name: 현금 사용 증빙서류
        properties:
          minimum_count: 2

  - id: cash_withdrawal.blocked
    label: 현금인출 불가
    node_label: PolicyRule
    decision: blocked
    source_block_id: ocr-page-13-block-0
    evidence_text: "현금 사용이란 계좌이체를 말하며, 현금인출은 불가합니다."
    properties:
      intent: cash_transfer
      rule_type: block
      support_level: direct
    relationships:
      - type: PROHIBITED_BY_METHOD
        target_label: PaymentMethod
        target_key: method_cash_withdrawal
        target_name: 현금인출
        properties:
          reason: 현금 사용은 계좌이체만 의미하며 현금인출은 불가

  - id: cash_transfer.missing_evidence.penalty
    label: 현금 증빙 미흡 시 환수 또는 지급 중단
    node_label: PolicyRule
    decision: restricted
    source_block_id: ocr-page-13-block-0
    evidence_text: "증빙이 미흡한 경우 지원금 환수 또는 지급 중단될 수 있으니 증빙서류를 꼭 제출해야 합니다."
    properties:
      intent: cash_transfer
      rule_type: penalty
      support_level: direct
      condition: 현금 사용 증빙 미흡 또는 허위 서류 제출
    relationships:
      - type: VIOLATION_CAUSES
        target_label: Penalty
        target_key: penalty_recovery_or_payment_stop
        target_name: 지원금 환수 또는 지급 중단
        properties:
          reason: 증빙 미흡, 허위 서류, 증빙 미제출

  - id: cash_transfer.rent.evidence
    label: 월세 계좌이체 증빙서류
    node_label: PolicyRule
    decision: conditional
    source_block_id: ocr-page-13-block-1
    evidence_text: "주거비 | 월세 | ① 임대차계약서 | ② 이체확인증 | ③주민등록등본(해당자만)"
    properties:
      intent: cash_transfer
      rule_type: require_evidence
      support_level: direct
    relationships:
      - type: ALLOWS
        target_label: SpendingItem
        target_key: item_rent
        target_name: 월세
        properties:
          condition: 계좌이체 후 필수 증빙서류 제출
      - type: REQUIRES_EVIDENCE
        target_label: EvidenceDocument
        target_key: doc_lease_contract
        target_name: 임대차계약서
      - type: REQUIRES_EVIDENCE
        target_label: EvidenceDocument
        target_key: doc_transfer_confirmation
        target_name: 이체확인증
      - type: REQUIRES_EVIDENCE
        target_label: EvidenceDocument
        target_key: doc_resident_registration
        target_name: 주민등록등본
        properties:
          condition: 해당자만

  - id: cash_transfer.management_fee.evidence
    label: 관리비 계좌이체 증빙서류
    node_label: PolicyRule
    decision: conditional
    source_block_id: ocr-page-13-block-1
    evidence_text: "주거비 | 관리비 | ①고지서(임대차계약서에 관리비 조항이 있을 경우 임대차계약서 제출 가능) | ② 이체확인증 | ③ 주민등록등본(해당자만)"
    properties:
      intent: cash_transfer
      rule_type: require_evidence
      support_level: direct
    relationships:
      - type: ALLOWS
        target_label: SpendingItem
        target_key: item_management_fee
        target_name: 관리비
        properties:
          condition: 계좌이체 후 필수 증빙서류 제출
      - type: REQUIRES_EVIDENCE
        target_label: EvidenceDocument
        target_key: doc_bill
        target_name: 고지서
      - type: REQUIRES_EVIDENCE
        target_label: EvidenceDocument
        target_key: doc_transfer_confirmation
        target_name: 이체확인증
      - type: REQUIRES_EVIDENCE
        target_label: EvidenceDocument
        target_key: doc_resident_registration
        target_name: 주민등록등본
        properties:
          condition: 해당자만

  - id: cash_transfer.utility_bill.evidence
    label: 공과금 계좌이체 증빙서류
    node_label: PolicyRule
    decision: conditional
    source_block_id: ocr-page-13-block-1
    evidence_text: "주거비 | 공과금 | ①고지서 | ② 이체확인증"
    properties:
      intent: cash_transfer
      rule_type: require_evidence
      support_level: direct
    relationships:
      - type: ALLOWS
        target_label: SpendingItem
        target_key: item_utility_bill
        target_name: 공과금
      - type: REQUIRES_EVIDENCE
        target_label: EvidenceDocument
        target_key: doc_bill
        target_name: 고지서
      - type: REQUIRES_EVIDENCE
        target_label: EvidenceDocument
        target_key: doc_transfer_confirmation
        target_name: 이체확인증

  - id: cash_transfer.housing_loan.evidence
    label: 주거 관련 대출 계좌이체 증빙서류
    node_label: PolicyRule
    decision: conditional
    source_block_id: ocr-page-13-block-1
    evidence_text: "주거비 | 주거 관련 대출 (원금 및 이자) | ①대출거래약정서 | ② 이체확인증"
    properties:
      intent: cash_transfer
      rule_type: require_evidence
      support_level: direct
    relationships:
      - type: ALLOWS
        target_label: SpendingItem
        target_key: item_housing_loan
        target_name: 주거 관련 대출 원금 및 이자
      - type: REQUIRES_EVIDENCE
        target_label: EvidenceDocument
        target_key: doc_loan_agreement
        target_name: 대출거래약정서
      - type: REQUIRES_EVIDENCE
        target_label: EvidenceDocument
        target_key: doc_transfer_confirmation
        target_name: 이체확인증

  - id: cash_transfer.phone_bill.evidence
    label: 통신비 계좌이체 증빙서류
    node_label: PolicyRule
    decision: conditional
    source_block_id: ocr-page-13-block-1
    evidence_text: "생활비 | 통신비 | ①고지서(상세) | ② 이체확인증"
    properties:
      intent: cash_transfer
      rule_type: require_evidence
      support_level: direct
    relationships:
      - type: ALLOWS
        target_label: SpendingItem
        target_key: item_phone_bill
        target_name: 통신비
      - type: REQUIRES_EVIDENCE
        target_label: EvidenceDocument
        target_key: doc_detailed_bill
        target_name: 고지서(상세)
      - type: REQUIRES_EVIDENCE
        target_label: EvidenceDocument
        target_key: doc_transfer_confirmation
        target_name: 이체확인증

  - id: cash_transfer.student_loan.evidence
    label: 학자금대출 계좌이체 증빙서류
    node_label: PolicyRule
    decision: conditional
    source_block_id: ocr-page-13-block-1
    evidence_text: "교육비·구직활동비 | 학자금 대출 (원금 및 이자) | ①대출거래약정서 | ② 이체확인증"
    properties:
      intent: cash_transfer
      rule_type: require_evidence
      support_level: direct
    relationships:
      - type: ALLOWS
        target_label: SpendingItem
        target_key: item_student_loan
        target_name: 학자금 대출 원금 및 이자
      - type: REQUIRES_EVIDENCE
        target_label: EvidenceDocument
        target_key: doc_loan_agreement
        target_name: 대출거래약정서
      - type: REQUIRES_EVIDENCE
        target_label: EvidenceDocument
        target_key: doc_transfer_confirmation
        target_name: 이체확인증

  - id: cash_transfer.exam_fee.evidence
    label: 시험 응시료 계좌이체 증빙서류
    node_label: PolicyRule
    decision: conditional
    source_block_id: ocr-page-13-block-1
    evidence_text: "교육비·구직활동비 | 시험 응시료 | ①수험표 또는 접수확인서 | ② 이체확인증"
    properties:
      intent: cash_transfer
      rule_type: require_evidence
      support_level: direct
    relationships:
      - type: ALLOWS
        target_label: SpendingItem
        target_key: item_exam_fee
        target_name: 시험 응시료
      - type: REQUIRES_EVIDENCE
        target_label: EvidenceDocument
        target_key: doc_exam_ticket_or_registration
        target_name: 수험표 또는 접수확인서
      - type: REQUIRES_EVIDENCE
        target_label: EvidenceDocument
        target_key: doc_transfer_confirmation
        target_name: 이체확인증

  - id: cash_transfer.overseas_ai.evidence
    label: 해외 생성형 AI 프로그램 구독료 계좌이체 증빙서류
    node_label: PolicyRule
    decision: conditional
    source_block_id: ocr-page-13-block-1
    evidence_text: "교육비·구직활동비 | 해외 생성형 AI 프로그램 구독료 | ①거래명세서 또는 영수증 | ② 이체확인증 (청년수당 계좌 · 본인 계좌)"
    properties:
      intent: cash_transfer
      rule_type: require_evidence
      support_level: direct
      condition: 개인이 보유한 카드로 결제한 내역과 실 지출 금액 확인 가능 서류 구비
    relationships:
      - type: ALLOWS
        target_label: SpendingItem
        target_key: item_overseas_generative_ai_subscription
        target_name: 해외 생성형 AI 프로그램 구독료
      - type: REQUIRES_EVIDENCE
        target_label: EvidenceDocument
        target_key: doc_transaction_statement_or_receipt
        target_name: 거래명세서 또는 영수증
      - type: REQUIRES_EVIDENCE
        target_label: EvidenceDocument
        target_key: doc_transfer_confirmation
        target_name: 이체확인증

  - id: evidence.lease_contract.required_fields
    label: 임대차계약서 필수 포함 내용
    node_label: PolicyRule
    decision: required
    source_block_id: ocr-page-14-block-0
    evidence_text: "임대차 계약서 - ■ 계약자(임대인 및 임차인) 정보"
    properties:
      intent: evidence_documents
      rule_type: document_required_fields
      support_level: direct
    relationships:
      - type: MUST_INCLUDE
        target_label: RequiredField
        target_key: field_lease_parties
        target_name: 계약자 정보

  - id: report.self_growth.monthly_required
    label: 자기성장기록서 매월 제출 의무
    node_label: PolicyRule
    decision: required
    source_block_id: ocr-page-20-block-0
    evidence_text: "매달 한 번, 주어진 기간 내에 제출하면 됩니다. 미제출 시 다음 회차부터 지원금 지급이 중단됩니다"
    properties:
