[project]
name = "youth-allowance-rag-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic-settings>=2.2",
  "python-dotenv>=1.0",
  "pytest>=8.0",
  "httpx>=0.27",
  "langchain>=0.2",
  "langchain-classic>=1.0",
  "langchain-community>=0.2",
  "langchain-openai>=0.1",
  "langchain-chroma>=0.1",
  "langchain-text-splitters>=0.2",
  "langgraph>=0.2",
  "chromadb>=0.5",
  "faiss-cpu>=1.8",
  "pypdf>=4.0",
  "pymupdf>=1.24",
  "rank-bm25>=0.2",
  "redis>=5.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# app만 배포 패키지로 포함한다. backend/ 아래 다른 폴더가 패키지로 잡혀 설치가 깨지는 것을 막는다.
[tool.setuptools.packages.find]
include = ["app*"]
